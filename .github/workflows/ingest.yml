name: Daily market data
on:
  schedule:
    - cron: "15 13 * * 1-5" # 15:15 Lusaka (UTC+2). LuSE prices are pasted in /admin: LuSE's site blocks GitHub's servers.
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEAR_NETWORK: ${{ vars.NEAR_NETWORK }}
      NEAR_ACCOUNT_ID: ${{ secrets.NEAR_ACCOUNT_ID }}
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run ingest -- boz crypto p2p defi brief sens-ai proofs roadmap
